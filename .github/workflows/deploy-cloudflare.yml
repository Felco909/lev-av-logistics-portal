name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      # Calling wrangler directly (same command used successfully from a local
      # machine throughout this project) instead of cloudflare/wrangler-action@v3.
      # The action's output is grouped into folded log sections that were
      # repeatedly impossible to fully read back from the GitHub UI while
      # diagnosing earlier failures — a plain `run:` step prints wrangler's own
      # output straight into the step log with nothing hidden. Pinning the
      # exact wrangler version here too (npx wrangler@4.124.0), matching
      # package.json's devDependency, removes any doubt about which version runs.
      - run: npx wrangler@4.124.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffbe1b5a9458be8f77afcd5a769b7275
